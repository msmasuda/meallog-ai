name: meallog_ai
description: つぎのごはん - AI献立提案アプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  llamadart: any
  go_router: ^14.6.2
  shared_preferences: ^2.3.5
  dio: ^5.7.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  # Spec called for ^2.4.3 but riverpod_generator >=2.4.2 requires analyzer ^6.5.0+,
  # which conflicts with isar_generator 3.x (requires analyzer <6.0.0, source_gen ^1.2.2).
  # 2.3.11 uses analyzer >=5.12.0 <7.0.0 and source_gen ^1.2.0 — compatible with isar.
  riverpod_generator: ^2.3.11
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
